# nginx site for the new Astro build of alteranlabs.co.uk.
# Install as /etc/nginx/sites-available/alteranlabs.co.uk (see deploy/README.md).
# Certbot adds the HTTPS (listen 443 / ssl_certificate) lines when you run
#   sudo certbot --nginx -d alteranlabs.co.uk -d www.alteranlabs.co.uk

server {
    listen 80;
    listen [::]:80;
    server_name alteranlabs.co.uk www.alteranlabs.co.uk;

    # The deploy workflow points this symlink at the latest release.
    root /var/www/alteranlabs.co.uk/current;
    index index.html;

    # Old October CMS blog URLs -> new post URLs (mirrors public/_redirects).
    location ~ ^/blog/?$ { return 301 /posts/; }
    location ~ ^/blog/post/([^/]+)/?$ { return 301 /posts/$1/; }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Astro fingerprints everything under /_astro/, so it can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
}
