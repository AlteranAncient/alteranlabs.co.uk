# nginx config for the Astro site's container (mounted as
# /etc/nginx/conf.d/default.conf by deploy/compose.yml). Traefik handles
# HTTPS and the www redirect in front of it.

server {
    listen 80;
    server_name _;

    # /usr/share/nginx/html is the bind-mounted deploy folder; the deploy
    # workflow points the "current" symlink at the latest release.
    root /usr/share/nginx/html/current;
    index index.html;

    # Behind Traefik, nginx only sees plain HTTP on port 80, so keep redirect
    # Location headers relative rather than http://host/...
    absolute_redirect off;

    # The old blog posts stay on the old site (mirrors public/_redirects).
    location ~ ^/blog(/.*)?$ { return 301 https://old.alteranlabs.co.uk$request_uri; }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Astro fingerprints everything under /_astro/, so it can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
}
